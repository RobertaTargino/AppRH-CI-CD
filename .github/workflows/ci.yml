name: CI AppRH

on:
  push:
    branches: [main]

jobs:
  testes:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Configurar Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Executar testes do backend
        run: mvn -B -Dtest=AuthServiceTest test

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Executar testes do frontend
        run: node --test frontend-testes/login.test.js frontend-testes/cadastro.test.js
