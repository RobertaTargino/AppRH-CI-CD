
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Funcionário - AppRH</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f3f4f6;
            font-family: Arial, sans-serif;
            padding: 15px;
        }

        .cadastro-card {
            background-color: white;
            width: 100%;
            max-width: 330px;
            padding: 24px;
            border: 1px solid #dedee3;
            border-radius: 18px;
        }

        h2 {
            font-size: 20px;
            color: #18181b;
            margin: 0 0 22px;
        }

        label {
            display: block;
            font-size: 14px;
            margin-bottom: 7px;
        }

        input[type="text"],
        input[type="number"] {
            display: block;
            width: 100%;
            padding: 8px;
            margin-bottom: 18px;
            border: 1px solid #dedee3;
            border-radius: 0;
            font-size: 14px;
            outline: none;
        }

        input[type="text"]:focus,
        input[type="number"]:focus {
            border-color: #dedee3;
        }

        input[type="submit"] {
            display: block;
            width: auto;
            margin: 0 auto;
            padding: 5px;
            background: transparent;
            color: #18181b;
            border: none;
            border-bottom: 1px solid #18181b;
            border-radius: 0;
            font-size: 14px;
            cursor: pointer;
        }

        .links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 24px;
        }

        .links a {
            color: #18181b;
            font-size: 13px;
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="cadastro-card">
        <h2>Cadastro de Funcionários</h2>

        <form id="funcionarioForm">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" required>

            <label for="cargo">Cargo:</label>
            <input type="text" id="cargo" name="cargo" required>

            <label for="salario">Salário:</label>
            <input type="number" id="salario" name="salario"
                   step="0.01" min="0" required>

            <input type="submit" value="Cadastrar Funcionário">
        </form>

       <div class="links">
    <a href="listarFuncionarios.html">Listar Funcionários</a>
    <a href="cadastrarUsuario.html">Usuários</a>
    <a href="/auth/logout">Sair</a>
</div>
    </div>

    <script>
        async function onSubmit(evt) {
            evt.preventDefault();

            const form = evt.target;

            const funcionario = {
                nome: form.elements['nome'].value,
                cargo: form.elements['cargo'].value,
                salario: parseFloat(form.elements['salario'].value)
            };

            const res = await fetch('/funcionarios/add', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(funcionario)
            });

            if (res.ok) {
                alert('Funcionário cadastrado');
                window.location.href = 'listarFuncionarios.html';
            } else {
                alert('Erro, não é possível cadastrar funcionário');
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('funcionarioForm')
                .addEventListener('submit', onSubmit);
        });
    </script>
</body>
</html>
